spring.application.name=sirma
spring.profiles.active=dev

spring.config.import=optional:file:.env[.properties]

# ======================================================================
# Configuracion de Base de Datos (AWS RDS MySQL)
# Permite conexion directa por DB_URL o compuesta por DB_HOST, DB_PORT, etc.
# ======================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sirma}?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ======================================================================
# Configuracion de Mail Sender (contrase?a temporal)
# ======================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# URL del frontend para el boton del correo de bienvenida
app.login-url=${APP_LOGIN_URL:http://localhost:5173/login}

# URL base del frontend para enlaces de restablecimiento (ej: http://localhost:5173)
app.reset-base-url=${APP_RESET_BASE_URL:http://localhost:5173}

# ======================================================================
# AWS S3 - Almacenamiento de archivos e imagenes
# ======================================================================
aws.s3.bucket=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# ======================================================================
# Multipart ? l?mite de tama?o para im?genes subidas
# ======================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ======================================================================
# Configuracion de JWT
# ======================================================================
jwt.secret=EstaEsUnaClaveSuperSecretaYDebeSerMuyLargaParaQueSeaSegura1234567890
jwt.expiration=3600000
